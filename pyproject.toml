[project]
name = "lzt-eventus-sdk"
version = "0.1.1"
description = "Async Python client for lzt-eventus's event_engine management API (subscriptions, polling, webhook verification)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zlexdev" }]
keywords = ["lzt", "eventus", "event-engine", "sdk", "client", "webhook"]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/open-lzt/lzt-eventus-sdk"
Repository = "https://github.com/open-lzt/lzt-eventus-sdk"

[project.optional-dependencies]
ws = [
    "websockets>=12",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "websockets>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lzt_eventus_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lzt_eventus_sdk"]
mypy_path = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
